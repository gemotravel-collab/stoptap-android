      - name: Add Adelaide Metro live arrivals
        run: |
          python - <<'PY'
          import csv
          import io
          import json
          import os
          import zipfile
          from pathlib import Path

          root = Path(os.environ["PROJECT_DIR"])

          gradle_path = root / "app" / "build.gradle"
          gradle = gradle_path.read_text()
          if "gtfs-realtime-bindings" not in gradle:
              gradle += "\n\ndependencies {\n    implementation group: 'org.mobilitydata', name: 'gtfs-realtime-bindings', version: '0.0.8'\n}\n"
          gradle = gradle.replace("versionCode 6", "versionCode 8")
          gradle = gradle.replace("versionName '5.6-alpha'", "versionName '5.7.1-alpha'")
          gradle_path.write_text(gradle)

          with zipfile.ZipFile("/tmp/google_transit.zip") as z:
              routes_text = z.read("routes.txt").decode("utf-8-sig")
              trips_text = z.read("trips.txt").decode("utf-8-sig")

          routes = {}
          for row in csv.DictReader(io.StringIO(routes_text)):
              rid = (row.get("route_id") or "").strip()
              if not rid:
                  continue
              label = (row.get("route_short_name") or "").strip()
              if not label:
                  label = (row.get("route_long_name") or "").strip()
              if not label:
                  label = rid
              routes[rid] = label

          trip_meta = {}
          for row in csv.DictReader(io.StringIO(trips_text)):
              tid = (row.get("trip_id") or "").strip()
              rid = (row.get("route_id") or "").strip()
              if not tid:
                  continue
              route_label = routes.get(rid, rid or "Service")
              headsign = (row.get("trip_headsign") or "").strip()
              route_label = route_label.replace("\t", " ").replace("\n", " ")
              headsign = headsign.replace("\t", " ").replace("\n", " ")
              trip_meta[tid] = route_label + "\t" + headsign

          assets = root / "app" / "src" / "main" / "assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "trip_meta.json").write_text(
              json.dumps(trip_meta, ensure_ascii=False, separators=(",", ":"))
          )

          html_path = assets / "index.html"
          html = html_path.read_text()
          html = html.replace("v5.6 · trip now", "v5.7.1 · live feed fix")
          html_path.write_text(html)

          layout = root / "app" / "src" / "main" / "res" / "layout" / "activity_trip_now.xml"
          xml = layout.read_text()
          xml = xml.replace(
              'android:text="Live arrival countdown is the next StopTap build."',
              'android:text="Loading Adelaide Metro live arrivals…"'
          )
          xml = xml.replace(
              'android:text="OPEN LIVE STOP"',
              'android:text="REFRESH LIVE TIMES"'
          )
          layout.write_text(xml)

          java_dir = root / "app" / "src" / "main" / "java" / "au" / "com" / "stoptap" / "app"

          (java_dir / "TripNowActivity.java").write_text(r'''package au.com.stoptap.app;

          import android.Manifest;
          import android.app.Activity;
          import android.appwidget.AppWidgetManager;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageManager;
          import android.location.Location;
          import android.location.LocationManager;
          import android.os.Build;
          import android.os.Bundle;
          import android.widget.Button;
          import android.widget.TextView;

          import com.google.transit.realtime.GtfsRealtime;

          import org.json.JSONArray;
          import org.json.JSONObject;

          import java.io.BufferedReader;
          import java.io.InputStream;
          import java.io.InputStreamReader;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Date;
          import java.util.List;
          import java.util.Locale;
          import java.util.concurrent.ExecutorService;
          import java.util.concurrent.Executors;

          public class TripNowActivity extends Activity {
              private static final int LOCATION_REQ = 2002;
              private static final String TRIP_UPDATES_URL =
                      "https://gtfs.adelaidemetro.com.au/v1/realtime/trip_updates";

              private int widgetId = AppWidgetManager.INVALID_APPWIDGET_ID;
              private double stopLat = Double.NaN;
              private double stopLon = Double.NaN;
              private String stopCode = "";
              private String stopId = "";

              private TextView distanceView;
              private TextView walkView;
              private TextView statusView;
              private Button liveButton;

              private JSONObject tripMeta = new JSONObject();
              private final ExecutorService executor = Executors.newSingleThreadExecutor();
              private volatile boolean loadingLive = false;

              static class Arrival {
                  long epoch;
                  String route;
                  String headsign;

                  Arrival(long epoch, String route, String headsign) {
                      this.epoch = epoch;
                      this.route = route;
                      this.headsign = headsign;
                  }
              }

              @Override
              protected void onCreate(Bundle savedInstanceState) {
                  super.onCreate(savedInstanceState);
                  setContentView(R.layout.activity_trip_now);

                  widgetId = getIntent().getIntExtra(
                          AppWidgetManager.EXTRA_APPWIDGET_ID,
                          AppWidgetManager.INVALID_APPWIDGET_ID
                  );

                  TextView routeView = findViewById(R.id.trip_route_name);
                  TextView stopView = findViewById(R.id.trip_stop);
                  distanceView = findViewById(R.id.trip_distance);
                  walkView = findViewById(R.id.trip_walk);
                  statusView = findViewById(R.id.trip_status);
                  liveButton = findViewById(R.id.live_stop_button);
                  Button editButton = findViewById(R.id.edit_route_button);

                  String json = getSharedPreferences("stoptap", Context.MODE_PRIVATE)
                          .getString("widget_route_" + widgetId, null);
                  if (json == null) {
                      json = getSharedPreferences("stoptap", Context.MODE_PRIVATE)
                              .getString("latest_route", null);
                  }

                  String routeName = "Saved route";
                  String stopName = "No saved start stop";

                  if (json != null) {
                      try {
                          JSONObject route = new JSONObject(json);
                          routeName = route.optString("name", routeName);
                          JSONArray from = route.optJSONArray("from");
                          if (from != null && from.length() > 0) {
                              JSONObject stop = from.getJSONObject(0);
                              stopName = stop.optString("name", "Start stop");
                              stopCode = stop.optString("code", "");
                              stopId = stop.optString("id", "");
                              stopLat = stop.optDouble("lat", Double.NaN);
                              stopLon = stop.optDouble("lon", Double.NaN);

                              if (stopId.isEmpty()) stopId = stopCode;
                              if (!stopCode.isEmpty()) stopName += "  #" + stopCode;
                          }
                      } catch (Exception ignored) {}
                  }

                  routeView.setText(routeName);
                  stopView.setText(stopName);

                  loadTripMeta();

                  liveButton.setEnabled(!stopId.isEmpty() || !stopCode.isEmpty());
                  liveButton.setOnClickListener(v -> loadLiveArrivals());

                  editButton.setOnClickListener(v -> {
                      startActivity(new Intent(this, MainActivity.class));
                      finish();
                  });

                  updateWalkingDistance();
                  loadLiveArrivals();
              }

              private void loadTripMeta() {
                  try (
                          InputStream in = getAssets().open("trip_meta.json");
                          BufferedReader reader = new BufferedReader(new InputStreamReader(in))
                  ) {
                      StringBuilder text = new StringBuilder();
                      String line;
                      while ((line = reader.readLine()) != null) text.append(line);
                      tripMeta = new JSONObject(text.toString());
                  } catch (Exception ignored) {
                      tripMeta = new JSONObject();
                  }
              }

              private void loadLiveArrivals() {
                  if (loadingLive) return;

                  if (stopId.isEmpty() && stopCode.isEmpty()) {
                      statusView.setText("No saved start stop.");
                      return;
                  }

                  loadingLive = true;
                  liveButton.setEnabled(false);
                  liveButton.setText("UPDATING…");
                  statusView.setText("Loading Adelaide Metro live arrivals…");

                  executor.execute(() -> {
                      try {
                          List<Arrival> arrivals = fetchArrivals();

                          runOnUiThread(() -> {
                              renderArrivals(arrivals);
                              loadingLive = false;
                              liveButton.setEnabled(true);
                              liveButton.setText("REFRESH LIVE TIMES");
                          });
                      } catch (Exception e) {
                          final String message = readableError(e);
                          runOnUiThread(() -> {
                              statusView.setText(
                                      "Live arrivals are temporarily unavailable.\n\n"
                                      + message
                                      + "\n\nTap REFRESH LIVE TIMES to try again."
                              );
                              loadingLive = false;
                              liveButton.setEnabled(true);
                              liveButton.setText("REFRESH LIVE TIMES");
                          });
                      }
                  });
              }

              private List<Arrival> fetchArrivals() throws Exception {
                  HttpURLConnection connection = (HttpURLConnection)
                          new URL(TRIP_UPDATES_URL).openConnection();

                  connection.setConnectTimeout(10000);
                  connection.setReadTimeout(15000);
                  connection.setRequestMethod("GET");
                  connection.setRequestProperty(
                          "Accept",
                          "application/x-google-protobuf"
                  );
                  connection.setRequestProperty("User-Agent", "StopTap-Android/5.7.1");
                  connection.setRequestProperty("Accept-Encoding", "identity");

                  int http = connection.getResponseCode();
                  if (http != HttpURLConnection.HTTP_OK) {
                      connection.disconnect();
                      throw new Exception("Adelaide Metro live feed returned HTTP " + http + ".");
                  }

                  String contentType = connection.getContentType();
                  if (contentType == null ||
                          !contentType.toLowerCase(Locale.ROOT).contains("protobuf")) {
                      connection.disconnect();
                      throw new Exception(
                              "Unexpected Adelaide Metro feed type: " + contentType
                      );
                  }

                  GtfsRealtime.FeedMessage feed;
                  try (InputStream input = connection.getInputStream()) {
                      feed = GtfsRealtime.FeedMessage.parseFrom(input);
                  } finally {
                      connection.disconnect();
                  }

                  long now = System.currentTimeMillis() / 1000L;
                  List<Arrival> arrivals = new ArrayList<>();

                  for (GtfsRealtime.FeedEntity entity : feed.getEntityList()) {
                      if (!entity.hasTripUpdate()) continue;

                      GtfsRealtime.TripUpdate update = entity.getTripUpdate();
                      String tripId = update.getTrip().getTripId();
                      String routeId = update.getTrip().getRouteId();

                      for (GtfsRealtime.TripUpdate.StopTimeUpdate stu :
                              update.getStopTimeUpdateList()) {

                          if (!stu.hasStopId()) continue;
                          String liveStopId = stu.getStopId();

                          boolean correctStop =
                                  (!stopId.isEmpty() && stopId.equals(liveStopId))
                                  || (!stopCode.isEmpty() && stopCode.equals(liveStopId));

                          if (!correctStop) continue;

                          long epoch = 0L;
                          if (stu.hasArrival() && stu.getArrival().hasTime()) {
                              epoch = stu.getArrival().getTime();
                          } else if (stu.hasDeparture() && stu.getDeparture().hasTime()) {
                              epoch = stu.getDeparture().getTime();
                          }

                          if (epoch <= 0L) continue;

                          long secondsAway = epoch - now;
                          if (secondsAway < -60L || secondsAway > 7200L) continue;

                          String route = routeId == null ? "" : routeId;
                          String headsign = "";

                          String meta = tripMeta.optString(tripId, "");
                          if (!meta.isEmpty()) {
                              int tab = meta.indexOf('\t');
                              if (tab >= 0) {
                                  route = meta.substring(0, tab).trim();
                                  headsign = meta.substring(tab + 1).trim();
                              } else {
                                  route = meta.trim();
                              }
                          }

                          if (route.isEmpty()) route = "Service";
                          arrivals.add(new Arrival(epoch, route, headsign));
                          break;
                      }
                  }

                  Collections.sort(arrivals, (a, b) -> Long.compare(a.epoch, b.epoch));
                  return arrivals;
              }

              private void renderArrivals(List<Arrival> arrivals) {
                  if (arrivals.isEmpty()) {
                      statusView.setText(
                              "No live predictions are currently available for this stop.\n\n"
                              + "Tap REFRESH LIVE TIMES to check again."
                      );
                      return;
                  }

                  long now = System.currentTimeMillis() / 1000L;
                  int count = Math.min(3, arrivals.size());
                  StringBuilder out = new StringBuilder();

                  for (int i = 0; i < count; i++) {
                      Arrival a = arrivals.get(i);
                      long seconds = Math.max(0L, a.epoch - now);
                      int minutes = (int) Math.ceil(seconds / 60.0);

                      String when;
                      if (seconds <= 30L) {
                          when = "Due";
                      } else if (minutes == 1) {
                          when = "1 min";
                      } else {
                          when = minutes + " mins";
                      }

                      String clock = new SimpleDateFormat(
                              "h:mm a", Locale.getDefault()
                      ).format(new Date(a.epoch * 1000L));

                      out.append(a.route);
                      if (!a.headsign.isEmpty()) out.append(" → ").append(a.headsign);
                      out.append(" — ").append(when);
                      out.append("  (").append(clock).append(")");

                      if (i < count - 1) out.append("\n\n");
                  }

                  String updated = new SimpleDateFormat(
                          "h:mm a", Locale.getDefault()
                  ).format(new Date());

                  out.append("\n\nUpdated ").append(updated)
                          .append(" · Adelaide Metro live");

                  statusView.setText(out.toString());
              }

              private String readableError(Exception e) {
                  String m = e.getMessage();
                  if (m == null || m.trim().isEmpty()) {
                      return "Could not read the live feed.";
                  }
                  if (m.length() > 120) m = m.substring(0, 120);
                  return m;
              }

              private boolean hasLocationPermission() {
                  return checkSelfPermission(Manifest.permission.ACCESS_FINE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED
                          || checkSelfPermission(Manifest.permission.ACCESS_COARSE_LOCATION)
                          == PackageManager.PERMISSION_GRANTED;
              }

              private void updateWalkingDistance() {
                  if (Double.isNaN(stopLat) || Double.isNaN(stopLon)) {
                      distanceView.setText("No stop coordinates saved");
                      walkView.setText("Walk: —");
                      return;
                  }

                  if (!hasLocationPermission()) {
                      distanceView.setText("Allow location once to calculate your walk");
                      walkView.setText("Walk: —");
                      requestPermissions(
                              new String[]{
                                      Manifest.permission.ACCESS_FINE_LOCATION,
                                      Manifest.permission.ACCESS_COARSE_LOCATION
                              },
                              LOCATION_REQ
                      );
                      return;
                  }

                  distanceView.setText("Finding your current location…");
                  walkView.setText("Walk: calculating…");

                  try {
                      LocationManager lm = (LocationManager) getSystemService(LOCATION_SERVICE);

                      Location best = newest(
                              safeLastKnown(lm, LocationManager.GPS_PROVIDER),
                              safeLastKnown(lm, LocationManager.NETWORK_PROVIDER)
                      );
                      best = newest(
                              best,
                              safeLastKnown(lm, LocationManager.PASSIVE_PROVIDER)
                      );

                      if (best != null) showWalkingDistance(best);

                      if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.R) {
                          String provider = lm.isProviderEnabled(
                                  LocationManager.NETWORK_PROVIDER
                          )
                                  ? LocationManager.NETWORK_PROVIDER
                                  : LocationManager.GPS_PROVIDER;

                          lm.getCurrentLocation(
                                  provider,
                                  null,
                                  getMainExecutor(),
                                  location -> {
                                      if (location != null) showWalkingDistance(location);
                                  }
                          );
                      }
                  } catch (Exception e) {
                      distanceView.setText("Location is temporarily unavailable");
                      walkView.setText("Walk: —");
                  }
              }

              private Location safeLastKnown(LocationManager lm, String provider) {
                  try {
                      if (!lm.isProviderEnabled(provider)) return null;
                      return lm.getLastKnownLocation(provider);
                  } catch (Exception e) {
                      return null;
                  }
              }

              private Location newest(Location a, Location b) {
                  if (a == null) return b;
                  if (b == null) return a;
                  return a.getTime() >= b.getTime() ? a : b;
              }

              private void showWalkingDistance(Location current) {
                  float[] result = new float[1];

                  Location.distanceBetween(
                          current.getLatitude(),
                          current.getLongitude(),
                          stopLat,
                          stopLon,
                          result
                  );

                  int metres = Math.max(0, Math.round(result[0]));
                  int minutes = Math.max(1, (int) Math.ceil(metres / 75.0));

                  distanceView.setText(metres + " m from you");
                  walkView.setText(
                          "Walk: about " + minutes
                          + (minutes == 1 ? " min" : " mins")
                  );
              }

              @Override
              public void onRequestPermissionsResult(
                      int requestCode,
                      String[] permissions,
                      int[] grantResults
              ) {
                  super.onRequestPermissionsResult(
                          requestCode,
                          permissions,
                          grantResults
                  );

                  if (requestCode == LOCATION_REQ) {
                      if (hasLocationPermission()) {
                          updateWalkingDistance();
                      } else {
                          distanceView.setText(
                                  "Location not allowed — walking time hidden"
                          );
                          walkView.setText("Walk: —");
                      }
                  }
              }

              @Override
              protected void onDestroy() {
                  executor.shutdownNow();
                  super.onDestroy();
              }
          }
          ''')

          print("v5.7 live arrivals added using Adelaide Metro GTFS-Realtime trip_updates.")
          print("Trip lookup entries:", len(trip_meta))
