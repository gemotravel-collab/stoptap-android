name: Build StopTap APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Android SDK
        run: |
          S="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$S" ] || S="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -name sdkmanager -type f | head -1)"
          yes | "$S" --licenses >/dev/null 2>&1 || true
          "$S" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Prepare source and current Adelaide Metro stops
        run: |
          rm -rf build-src
          unzip -q stoptap_android_v5_alpha_source.zip -d build-src
          P="$(find build-src -maxdepth 2 -name settings.gradle -printf '%h\n' | head -1)"
          echo "PROJECT_DIR=$P" >> "$GITHUB_ENV"
          curl -fL --retry 3 "https://gtfs.adelaidemetro.com.au/v1/static/latest/google_transit.zip" -o /tmp/gtfs.zip
          unzip -t /tmp/gtfs.zip >/dev/null

      - name: Bundle stops into StopTap
        run: |
          python - <<'PY'
          import csv,io,json,os,zipfile
          from pathlib import Path
          from datetime import datetime,timezone

          p=Path(os.environ["PROJECT_DIR"])
          h=(p/"web_v43/index.html").read_text()

          with zipfile.ZipFile("/tmp/gtfs.zip") as z:
              rows=csv.DictReader(io.TextIOWrapper(z.open("stops.txt"),encoding="utf-8-sig"))
              s=[]
              for r in rows:
                  c=(r.get("stop_code") or "").strip()
                  if not c:
                      continue
                  try:
                      la,lo=float(r["stop_lat"]),float(r["stop_lon"])
                  except:
                      continue
                  s.append({
                      "id":(r.get("stop_id") or c).strip(),
                      "code":c,
                      "name":(r.get("stop_name") or "Adelaide Metro stop").strip(),
                      "lat":round(la,6),
                      "lon":round(lo,6)
                  })

          if len(s)<5000:
              raise SystemExit("Stop list too small: "+str(len(s)))

          if not {"17978","12828"}<={x["code"] for x in s}:
              raise SystemExit("Known test stops missing")

          h=h.replace('<script src="./jszip.min.js"></script>','')
          h=h.replace(
              "const PHOTON='/photon';",
              "const PHOTON='https://photon.komoot.io';"
          )
          h=h.replace(
              "v4.3 · native-widget bridge",
              "v5.4 · local stop database"
          )

          data=json.dumps(s,separators=(",",":"))
          snap=datetime.now(timezone.utc).strftime("%d %b %Y")

          patch="<script>\\nwindow.STOPTAP_STOPS="+data+";\\nwindow.STOPTAP_STOP_SNAPSHOT="+json.dumps(snap)+";\\nloadStops=async function(){if(state.stops)return state.stops;state.stops=window.STOPTAP_STOPS||[];return state.stops;};\\n</script>"

          h=h.replace("</body>",patch+"\\n</body>")

          a=p/"app/src/main/assets"
          a.mkdir(parents=True,exist_ok=True)
          (a/"index.html").write_text(h)

          print("Bundled",len(s),"stops")
          PY      - name: Make app load bundled control centre
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          p=Path(os.environ["PROJECT_DIR"])/"app/src/main/java/au/com/stoptap/app/MainActivity.java"
          s=p.read_text()

          s=s.replace(
              "import android.app.Activity;",
              "import android.app.Activity;\\nimport java.io.BufferedReader;\\nimport java.io.InputStreamReader;"
          )

          old='        webView.loadUrl(getString(R.string.control_centre_url));'

          new=('        try {\\n'
               '            StringBuilder h=new StringBuilder();\\n'
               '            try(BufferedReader r=new BufferedReader(new InputStreamReader(getAssets().open("index.html")))){\\n'
               '                String line; while((line=r.readLine())!=null) h.append(line).append("\\\\n");\\n'
               '            }\\n'
               '            webView.loadDataWithBaseURL(getString(R.string.control_centre_url),h.toString(),"text/html","UTF-8",null);\\n'
               '        } catch(Exception e) {\\n'
               '            Toast.makeText(this,"Could not load StopTap control centre.",Toast.LENGTH_LONG).show();\\n'
               '        }')

          if old not in s:
              raise SystemExit("MainActivity load line not found")

          p.write_text(s.replace(old,new))
          PY

          sed -i "s/versionCode 1/versionCode 4/" "$PROJECT_DIR/app/build.gradle"
          sed -i "s/versionName '5.0-alpha'/versionName '5.4-alpha'/" "$PROJECT_DIR/app/build.gradle"

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: StopTap-v5.4-local-stops-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
