name: Build StopTap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack StopTap source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q stoptap_android_v5_alpha_source.zip -d build-src
          PROJECT_DIR="$(find build-src -maxdepth 2 -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Build native control centre assets
        run: |
          python - <<'PY'
          from pathlib import Path
          import os

          root = Path(os.environ["PROJECT_DIR"])
          web = root / "web_v43"
          html = (web / "index.html").read_text()
          jszip = (web / "jszip.min.js").read_text()

          html = html.replace(
              '<script src="./jszip.min.js"></script>',
              '<script>\n' + jszip + '\n</script>'
          )

          html = html.replace(
              "const GTFS_URL='/metro/v1/static/latest/google_transit.zip';",
              "const GTFS_URL='https://dreamy-caramel-81066e.netlify.app/metro/v1/static/latest/google_transit.zip';"
          )

          html = html.replace(
              "const PHOTON='/photon';",
              "const PHOTON='https://photon.komoot.io';"
          )

          html = html.replace(
              'v4.3 · native-widget bridge',
              'v5.3 · native control centre'
          )

          assets = root / "app/src/main/assets"
          assets.mkdir(parents=True, exist_ok=True)
          (assets / "index.html").write_text(html)
          PY

      - name: Keep StopTap inside the Android app
        run: |
          sed -i 's#<string name="control_centre_url">.*</string>#<string name="control_centre_url">https://dreamy-caramel-81066e.netlify.app/</string>#' "$PROJECT_DIR/app/src/main/res/values/strings.xml"

          python - <<'PY'
          from pathlib import Path
          import os

          p = Path(os.environ["PROJECT_DIR"]) / "app/src/main/java/au/com/stoptap/app/MainActivity.java"
          text = p.read_text()

          if "import java.io.BufferedReader;" not in text:
              text = text.replace(
                  "import android.app.Activity;",
                  "import android.app.Activity;\n\nimport java.io.BufferedReader;\nimport java.io.InputStreamReader;"
              )

          old = '        webView.loadUrl(getString(R.string.control_centre_url));'

          new = '''        try {
              StringBuilder html = new StringBuilder();
              try (BufferedReader reader = new BufferedReader(
                      new InputStreamReader(getAssets().open("index.html")))) {
                  String line;
                  while ((line = reader.readLine()) != null) {
                      html.append(line).append("\\n");
                  }
              }
              String baseUrl = getString(R.string.control_centre_url);
              webView.loadDataWithBaseURL(
                      baseUrl,
                      html.toString(),
                      "text/html",
                      "UTF-8",
                      null
              );
          } catch (Exception e) {
              Toast.makeText(this, "Could not load StopTap control centre.", Toast.LENGTH_LONG).show();
          }'''

          if old not in text:
              raise SystemExit("Could not find the WebView load line.")

          text = text.replace(old, new)
          p.write_text(text)
          PY

      - name: Mark build as v5.3
        run: |
          sed -i "s/versionCode 1/versionCode 3/" "$PROJECT_DIR/app/build.gradle"
          sed -i "s/versionName '5.0-alpha'/versionName '5.3-alpha'/" "$PROJECT_DIR/app/build.gradle"

      - name: Build debug APK
        run: |
          cd "$PROJECT_DIR"
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: StopTap-v5.3-native-debug-apk
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
