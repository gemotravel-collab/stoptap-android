name: Build StopTap APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_SDK_ROOT/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          fi
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Unpack StopTap source
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -q stoptap_android_v5_alpha_source.zip -d build-src
          PROJECT_DIR="$(find build-src -maxdepth 2 -name settings.gradle -printf '%h\n' | head -n 1)"
          test -n "$PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

      - name: Download latest Adelaide Metro stop database for this build
        run: |
          GTFS="/tmp/google_transit.zip"
          curl --fail --location --retry 3 --retry-delay 2 \
            --user-agent "StopTap Android prototype" \
            --header "Accept: application/zip,*/*" \
            --referer "https://www.adelaidemetro.com.au/developer-info" \
            "https://gtfs.adelaidemetro.com.au/v1/static/latest/google_transit.zip" \
            --output "$GTFS"
          test -s "$GTFS"
          unzip -t "$GTFS" >/dev/null

      - name: Bundle Adelaide Metro stops inside StopTap
        run: |
          python - <<'PY'
          from pathlib import Path
          import csv, io, json, os, re, zipfile
          from datetime import datetime, timezone

